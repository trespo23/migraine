<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Дневник мигрени</title>
<meta name="theme-color" content="#e7e6e2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Мигрень">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geologica:wght@200;300;400;500;600&family=Onest:wght@700;800&display=swap">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:0}html,body{margin:0}</style>
<style>
/* Layout: soft stone ground, big rounded widget cards, blurred color blobs for state, black floating pill nav */
:root{
  --bg:#e7e6e2; --card:#f6f5f2; --card2:#dedcd7; --ink:#141414; --ink-2:#6e6c68; --ink-3:#a9a6a0;
  --line:#d3d0ca; --dark:#161616; --on-dark:#f4f3ef; --on-dark-2:#8e8c88;
  --lime:#d8f35a; --lime-ink:#141414; --orange:#f0864a; --pink:#ec7aa0; --green:#86c97a;
  --ok:#5e9e4a; --warn:#d88a1c; --bad:#d6493c;
  --p1:#d4ec8c; --p2:#eadb6a; --p3:#f2a75c; --p4:#ee7b5c; --p5:#dd4f6e;
  --display:"Onest","Geologica",system-ui,sans-serif;
  --font:"Geologica",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:30px;
}
:root,:root[data-theme]{color-scheme:light}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-weight:400;font-size:15px;line-height:1.45;margin:0;-webkit-font-smoothing:antialiased}
.app{max-width:520px;margin:0 auto;padding:14px 16px calc(120px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.muted{color:var(--ink-2)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px}
.eyebrow{font-size:11px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-2)}
.num{font-variant-numeric:tabular-nums}

/* top */
.top{display:flex;justify-content:space-between;align-items:center;padding-top:4px}
.brand{display:flex;align-items:center;gap:10px;font-size:11px;font-weight:600;letter-spacing:.22em;text-transform:uppercase}
.brand svg{width:26px;height:26px}
.lang-btn{display:inline-flex;align-items:center;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:3px;font-size:11.5px;font-weight:600;letter-spacing:.06em}
.lang-btn span{padding:5px 8px;border-radius:999px;color:var(--ink-2)}
.lang-btn span.on{background:#141414;color:#fff}
.theme-btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 12px 7px 10px;font-size:12px;font-weight:500}
.theme-btn svg{width:15px;height:15px}
.circ{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:inline-flex;align-items:center;justify-content:center;flex:none}
.circ svg{width:16px;height:16px}
.circ.dark{background:var(--dark);color:var(--on-dark);border-color:transparent}
.circ.sm{width:38px;height:38px}
.greet h1{font-family:var(--display);font-weight:800;font-size:clamp(40px,12vw,56px);line-height:.92;letter-spacing:-.035em;margin:10px 0 10px;text-transform:uppercase;text-wrap:balance}
.greet .date{font-size:11.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--ink-2)}
.sync{font-size:11px;color:var(--ink-3);letter-spacing:.04em}

/* cards */
.card{background:var(--card);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden;min-width:0}
.card .t{font-size:16px;font-weight:400;letter-spacing:-.005em}
.card .arrow{position:absolute;top:14px;right:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bignum{font-weight:300;font-size:52px;line-height:1;letter-spacing:-.03em;display:flex;align-items:flex-start;gap:4px}
.bignum sup{font-size:13px;font-weight:400;letter-spacing:0;margin-top:4px;color:var(--ink-2)}
.bignum small{font-size:15px;font-weight:400;align-self:flex-end;margin-bottom:6px;color:var(--ink-2)}
.midnum{font-weight:300;font-size:38px;line-height:1;letter-spacing:-.03em;display:flex;align-items:flex-start;gap:3px}
.midnum sup{font-size:12px;margin-top:3px;color:var(--ink-2);font-weight:400}

/* hero */
.hero{min-height:250px;padding:22px;justify-content:space-between;background:var(--card)}
.hero::before{content:"";position:absolute;inset:-30%;z-index:0;filter:blur(38px);opacity:.95;pointer-events:none}
.hero.calm::before{background:radial-gradient(60% 45% at 50% 105%,var(--lime),transparent 70%),radial-gradient(40% 35% at 90% 80%,#f4f7a0,transparent 70%)}
.hero.pain::before{background:radial-gradient(45% 45% at 25% 25%,var(--orange),transparent 70%),radial-gradient(45% 40% at 80% 55%,var(--pink),transparent 72%),radial-gradient(40% 30% at 40% 100%,#f7c28a,transparent 70%)}
.hero > *{position:relative;z-index:1}
.dotnum{font-family:var(--font);font-weight:200;font-size:100px;line-height:.95;letter-spacing:-.05em;font-variant-numeric:tabular-nums;margin-left:-4px}
.dotnum .colon{display:inline-block;margin:0 .02em;transform:translateY(-.06em)}
.hero .hlab{font-size:15px;color:var(--ink-2);margin-top:6px}
.pill-btn{display:flex;align-items:center;gap:12px;background:var(--dark);color:var(--on-dark);border:0;border-radius:999px;padding:7px 22px 7px 7px;font-size:16px;font-weight:500;width:100%}
.pill-btn .knob{width:48px;height:48px;border-radius:50%;background:var(--lime);color:var(--lime-ink);display:flex;align-items:center;justify-content:center;flex:none}
.pill-btn .knob svg{width:18px;height:18px}
.pill-btn .end{margin-left:auto;width:16px;height:16px;border-radius:50%;border:1.5px solid var(--on-dark-2)}
.btn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:11px 18px;font-weight:500;font-size:14px}
.btn.dark{background:var(--dark);color:var(--on-dark);border-color:transparent}
.btn.lime{background:var(--lime);color:var(--lime-ink);border-color:transparent}
.btn.glass{background:color-mix(in srgb,var(--card) 60%,transparent);backdrop-filter:blur(8px);border-color:color-mix(in srgb,var(--ink) 12%,transparent)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:8px 14px;font-size:13px}
.tag{display:inline-flex;align-items:center;gap:6px;border:1px solid color-mix(in srgb,var(--ink) 25%,transparent);border-radius:999px;padding:4px 11px;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase}

/* tick chart */
.ticks{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:5px;align-items:end;height:74px}
.ticks i{display:block;width:100%;max-width:9px;margin:0 auto;border-radius:6px;background:var(--ink);min-height:8px}
.ticks i.zero{background:var(--ink-3);height:8px}
.ticks i.today{background:var(--lime);outline:1px solid color-mix(in srgb,var(--ink) 20%,transparent)}
.ticks-refl{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:5px;height:14px;opacity:.35}
.ticks-refl i{display:block;width:100%;max-width:9px;margin:0 auto;border-radius:6px;background:var(--ink-3)}

/* dotted gauge */
.gauge{position:relative;width:100%;max-width:160px;aspect-ratio:1;margin:0 auto}
.gauge svg{width:100%;height:100%;display:block}
.gauge .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.gauge .c b{font-weight:300;font-size:34px;letter-spacing:-.03em;line-height:1}
.gauge .c span{font-size:11px;color:var(--ink-2)}
.state{font-size:10.5px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;text-align:center}

/* orion-style meter */
.meter{display:flex;align-items:center;height:30px;border-radius:999px;overflow:hidden;gap:0}
.meter .fill{height:100%;background:var(--card);border-radius:999px;display:flex;align-items:center;padding-left:10px;box-shadow:0 1px 0 color-mix(in srgb,var(--ink) 8%,transparent);min-width:30px}
.meter .fill::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--ink)}
.meter .rest{flex:1;height:18px;background:repeating-linear-gradient(90deg,var(--ink-3) 0 1.5px,transparent 1.5px 4.5px);opacity:.6;margin-left:6px}

/* dark card */
.card.darkc{background:var(--dark);color:var(--on-dark)}
.card.darkc .muted{color:var(--on-dark-2)}

/* list */
.list{display:flex;flex-direction:column;gap:8px}
.item{background:var(--card);border:0;border-radius:22px;padding:12px 14px 12px 12px;display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:12px;align-items:center;text-align:left;width:100%}
.lvl{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:500;font-size:18px;color:#141414}
.item .title{font-weight:500}
.item .meta{font-size:12.5px;color:var(--ink-2);overflow-wrap:anywhere}
.item .go{color:var(--ink-3)}
.empty{text-align:center;padding:30px 16px;align-items:center}
.sec{display:flex;justify-content:space-between;align-items:center;padding:6px 4px 0}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .dow{font-size:10px;letter-spacing:.14em;color:var(--ink-2);text-align:center;text-transform:uppercase}
.cal .d{aspect-ratio:1;max-width:100%;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12.5px;color:var(--ink-2);position:relative;background:var(--card2)}
.cal .d[data-day]:active{transform:scale(.92)}
.cal .d.today{box-shadow:inset 0 0 0 1.5px var(--ink)}
.cal .d.med::after{content:"";position:absolute;bottom:3px;width:4px;height:4px;border-radius:50%;background:#141414}
.cal .d.l1{background:var(--p1);color:#141414}.cal .d.l2{background:var(--p2);color:#141414}.cal .d.l3{background:var(--p3);color:#141414}.cal .d.l4{background:var(--p4);color:#141414}.cal .d.l5{background:var(--p5);color:#fff}
.legend{display:flex;gap:10px;align-items:center;font-size:11.5px;color:var(--ink-2);flex-wrap:wrap}
.legend i{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:4px;vertical-align:-1px}
.note{font-size:13px;line-height:1.4}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;padding:0 16px;z-index:5;pointer-events:none}
.nav .in{pointer-events:auto;background:#141414;color:#f4f3ef;border-radius:30px;padding:8px;display:grid;grid-template-columns:1fr 1fr auto 1fr 1fr;gap:4px;align-items:center;width:100%;max-width:420px;box-shadow:0 12px 30px rgba(0,0,0,.25)}
.nav .tab{background:none;border:0;color:#8e8c88;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:9px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:6px 2px;border-radius:18px}
.nav .tab svg{width:21px;height:21px}
.nav .tab[aria-selected="true"]{color:var(--lime)}
.nav .tab[aria-selected="true"]::after{content:"";width:4px;height:4px;border-radius:50%;background:var(--lime)}
.nav .plus{width:58px;height:58px;border-radius:50%;background:var(--lime);color:#141414;border:0;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 5px #141414,0 0 0 6px #3a3a36}
.nav .plus svg{width:24px;height:24px}

/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(20,20,20,.35);backdrop-filter:blur(4px);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:520px;max-height:94%;overflow:auto;border-radius:34px 34px 0 0;padding:14px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.sheet > *{flex-shrink:0}
.grab{width:40px;height:5px;border-radius:3px;background:var(--ink-3);margin:0 auto 2px}
.sheet h2{font-family:var(--display);font-weight:800;font-size:30px;text-transform:uppercase;letter-spacing:-.03em;margin:0;line-height:1}
.field{display:flex;flex-direction:column;gap:10px;min-width:0}
.times{display:grid;grid-template-columns:1fr;gap:12px}
.lab{font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-2)}
input[type=datetime-local],input[type=text],select,textarea{font:inherit;color:var(--ink);background:var(--card2);border:0;border-radius:16px;padding:12px 14px;width:100%;min-width:0}
textarea{min-height:76px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:8px 14px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--dark);color:var(--on-dark);border-color:transparent}
.chip.add{border-style:dashed}
.scale{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;align-items:end;height:112px}
.scale button{border:0;border-radius:14px;background:var(--card2);display:flex;align-items:flex-end;justify-content:center;padding:0 0 8px;font-size:13px;font-weight:500;color:var(--ink-2);width:100%}
.scale button[aria-pressed="true"]{color:#141414}
.scale-cap{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-2)}
.inten-read{display:flex;align-items:baseline;gap:10px}
.inten-read b{font-weight:300;font-size:44px;letter-spacing:-.03em;line-height:1}
.medrow{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:8px;padding:10px;border-radius:22px;background:var(--card)}
.medrow .full{grid-column:1/-1}
.sheet-actions{position:sticky;bottom:calc(-20px - env(safe-area-inset-bottom,0px));z-index:20;background:var(--bg);margin-inline:-16px;padding:12px 16px calc(20px + env(safe-area-inset-bottom,0px));box-shadow:0 -14px 16px -4px var(--bg)}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(12px + env(safe-area-inset-top,0px));width:max-content;box-shadow:0 8px 24px rgba(0,0,0,.2);background:#141414;color:#f4f3ef;padding:11px 18px;border-radius:999px;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
pre.report{white-space:pre-wrap;font-family:var(--font);font-size:12.5px;background:var(--card);padding:16px;border-radius:22px;max-height:300px;overflow:auto;margin:0}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .25s cubic-bezier(.2,.8,.2,1)}@keyframes up{from{transform:translateY(40px);opacity:.5}}.hero::before{animation:drift 14s ease-in-out infinite alternate}@keyframes drift{to{transform:translate(4%,-3%) scale(1.06)}}}

/* v4: quick flow, pills, calendar badges */
.hero .qlab{font-size:10.5px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-2)}
.qscale{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.qscale button{aspect-ratio:1;max-width:100%;border-radius:50%;border:1px solid color-mix(in srgb,var(--ink) 18%,transparent);background:color-mix(in srgb,var(--card) 55%,transparent);font-size:12.5px;font-weight:500;padding:0;color:var(--ink)}
.qscale button[aria-pressed="true"]{color:#141414;border-color:transparent;transform:scale(1.12)}
.linkbtn{background:none;border:0;padding:0;text-decoration:underline;text-underline-offset:3px;text-decoration-color:color-mix(in srgb,var(--ink) 35%,transparent);color:var(--ink);font-size:14px}
.pillchip{display:inline-flex;align-items:center;gap:7px;border:1px solid color-mix(in srgb,var(--ink) 18%,transparent);background:color-mix(in srgb,var(--card) 55%,transparent);border-radius:999px;padding:7px 13px 7px 9px;font-size:13.5px}
.pillchip svg{width:17px;height:17px;flex:none}
.pillchip small{color:var(--ink-2);font-size:12px}
.pillchip.taken{background:var(--dark);color:var(--on-dark);border-color:transparent}
.pillchip.taken small{color:var(--on-dark-2)}
.pill-btn .knob.stop{background:var(--pink)}
.taken-list{display:flex;flex-direction:column;gap:4px;font-size:13px}
.taken-row{display:flex;align-items:center;gap:8px}
.taken-row svg{width:15px;height:15px}
.cal .d{overflow:visible}
.cal .d .pb{position:absolute;top:-4px;right:-5px;width:17px;height:17px;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 1.5px var(--card)}
.cal .d .pb svg{width:15px;height:15px}
.cal .d .pb b{position:absolute;bottom:-6px;right:-4px;font-size:9px;font-weight:600;background:var(--ink);color:var(--bg);border-radius:6px;padding:0 3px;line-height:12px}
.cal .d.l0{background:var(--card);box-shadow:inset 0 0 0 1.5px var(--ink-3);color:var(--ink)}
.cal .d.med::after{display:none}
.timebox{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card);border-radius:22px;padding:14px 16px}
.timebox .tv{display:flex;flex-direction:column;gap:2px}
.timebox .tv b{font-weight:400;font-size:17px}
.shifts{display:flex;gap:6px;flex-wrap:wrap}
.shifts button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 11px;font-size:12.5px}
.medtaken{display:flex;flex-direction:column;gap:10px;background:var(--card);border-radius:22px;padding:12px 14px}
.medtaken .hd{display:flex;align-items:center;gap:10px}
.medtaken .hd .mn{flex:1;min-width:0;line-height:1.25}
.medtaken .hd svg{width:20px;height:20px;flex:none}
.medtaken input[type=time]{font:inherit;color:var(--ink);background:var(--card2);border:0;border-radius:10px;padding:5px 8px;width:auto;margin-left:auto}
.eff{display:flex;gap:6px;flex-wrap:wrap}
.eff button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 11px;font-size:12.5px}
.eff button[aria-pressed="true"].e0{background:var(--lime);color:#141414;border-color:transparent}
.eff button[aria-pressed="true"].e1{background:var(--p3);color:#141414;border-color:transparent}
.eff button[aria-pressed="true"].e2{background:var(--p5);color:#fff;border-color:transparent}
.x{border:0;background:var(--card2);width:28px;height:28px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex:none}
.x svg{width:12px;height:12px}
.pillrow{display:grid;grid-template-columns:22px minmax(0,1.5fr) minmax(0,1fr) auto;gap:8px;align-items:center;background:var(--card);border-radius:18px;padding:8px 8px 8px 12px}
.pillrow svg{width:20px;height:20px}
.pillrow input{padding:9px 10px;border-radius:12px}
.hdr-btns{display:flex;gap:6px;align-items:center}
input[type=time]{font:inherit}

/* swipe slider */
.swipe{position:relative;height:62px;border-radius:999px;background:var(--dark);color:var(--on-dark);user-select:none;-webkit-user-select:none;touch-action:pan-y;overflow:hidden}
.swipe:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.swipe .knob{position:absolute;left:7px;top:7px;width:48px;height:48px;border-radius:50%;background:var(--lime);color:var(--lime-ink);display:flex;align-items:center;justify-content:center;z-index:3;cursor:grab;touch-action:none;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.swipe .knob svg{width:18px;height:18px}
.swipe.stop .knob{background:var(--pink)}
.swipe .knob:active{cursor:grabbing}
.swipe-fill{position:absolute;left:0;top:0;bottom:0;width:62px;border-radius:999px;background:color-mix(in srgb,var(--lime) 30%,transparent);z-index:1}
.swipe.stop .swipe-fill{background:color-mix(in srgb,var(--pink) 32%,transparent)}
.swipe-text{position:absolute;inset:0;display:flex;align-items:center;padding-left:72px;font-size:16px;font-weight:500;z-index:2;pointer-events:none}
.chev{position:absolute;right:22px;top:50%;transform:translateY(-50%);font-size:20px;letter-spacing:2px;z-index:2;pointer-events:none;color:var(--on-dark-2)}
.swipe.anim .knob,.swipe.anim .swipe-fill{transition:transform .28s cubic-bezier(.2,.8,.2,1),width .28s cubic-bezier(.2,.8,.2,1)}
@media (prefers-reduced-motion:no-preference){.chev{animation:chev 1.6s ease-in-out infinite}@keyframes chev{0%,100%{opacity:.35;transform:translate(-4px,-50%)}50%{opacity:1;transform:translate(2px,-50%)}}}

const CYR=/[А-Яа-яЁё]/;
function tr(s){ if(LANG!=="en"||!s||!CYR.test(s)) return s;
  s=s.replace(/(\d{1,2}) (января|февраля|марта|апреля|мая|июня|июля|августа|сентября|октября|ноября|декабря)/g,(m,d,mo)=>EN_MONTHS[MONTHS_G.indexOf(mo)].slice(0,3)+" "+d);
  for(const [re,v] of I18N_RULES){ if(CYR.test(s)) s=s.replace(re,v); else break; }
  return s; }
const TR_ATTRS=["placeholder","aria-label","title"];
function trTree(root){ if(LANG!=="en"||!root) return;
  if(root.nodeType===3){ const v=tr(root.nodeValue); if(v!==root.nodeValue) root.nodeValue=v; return; }
  if(root.nodeType!==1) return;
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT|NodeFilter.SHOW_ELEMENT,{acceptNode:n=>n.nodeType===1&&/^(SCRIPT|STYLE|TEXTAREA)$/.test(n.tagName)?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
  root.querySelectorAll&&root.querySelectorAll("textarea[placeholder]").forEach(t=>{ const o=t.getAttribute("placeholder"); if(CYR.test(o)) t.setAttribute("placeholder",tr(o)); });
  let n=root; do{ if(n.nodeType===3){ const v=tr(n.nodeValue); if(v!==n.nodeValue) n.nodeValue=v; } else for(const a of TR_ATTRS){ const o=n.getAttribute&&n.getAttribute(a); if(o&&CYR.test(o)) n.setAttribute(a,tr(o)); } }while((n=w.nextNode()));
}

  zoneAt(v,px,py){ const s=this.src(v), V=HEAD_VIEWS[s], L=this.labels[s]; if(!L) return null; px=Math.round(px); py=Math.round(py); if(px<0||py<0||px>=V.w||py>=V.h) return null;
    let id=L[py*V.w+px];
    if(!id){ /* forgiving tap: look around a little */ for(let r=2;r<=10&&!id;r+=2) for(const [dx,dy] of [[r,0],[-r,0],[0,r],[0,-r]]){ const x=px+dx,y=py+dy; if(x>=0&&y>=0&&x<V.w&&y<V.h&&L[y*V.w+x]){ id=L[y*V.w+x]; break; } } }
    if(!id) return null; const z=ZONES[id-1]; return v==="right"?swapLR(z):z; },
  drawOverlay(stage){
    const v=this.cur, s=this.src(v), V=HEAD_VIEWS[s], L=this.labels[s]; const cv=stage.querySelector("canvas"); if(!cv||!L) return;
    cv.width=V.w; cv.height=V.h; const x=cv.getContext("2d"); const id=x.createImageData(V.w,V.h); const d=id.data;
    const on=new Uint8Array(ZONES.length+1); this.zones.forEach(z=>{ const zz=v==="right"?swapLR(z):z; const i=ZONES.indexOf(zz); if(i>=0) on[i+1]=1; });
    const W=V.w,H=V.h;
    const A=[240,134,74], B=[236,110,150];
    const S=new Uint8Array(W*H); for(let i=0;i<S.length;i++) S[i]=on[L[i]];
    for(let y=0;y<H;y++){ const t=Math.min(1,Math.max(0,(y/H-.05)/.75)); const c0=A[0]+(B[0]-A[0])*t, c1=A[1]+(B[1]-A[1])*t, c2=A[2]+(B[2]-A[2])*t;
      const f0=c0+(255-c0)*.42, f1=c1+(255-c1)*.42, f2=c2+(255-c2)*.42;
      for(let xx=0;xx<W;xx++){ const i=y*W+xx;
        let n=0,cnt=0; for(let dy=-1;dy<=1;dy++){ const yy=y+dy; if(yy<0||yy>=H) continue; for(let dx=-1;dx<=1;dx++){ const x2=xx+dx; if(x2<0||x2>=W) continue; cnt++; n+=S[yy*W+x2]; } }
        if(!n) continue; const cov=n/cnt; const o=i*4;
        const edge=cov<1; const k=edge?.35:0;
        d[o]=f0*(1-k)+c0*.85*k; d[o+1]=f1*(1-k)+c1*.8*k; d[o+2]=f2*(1-k)+c2*.85*k; d[o+3]=Math.round(255*(S[i]?Math.max(cov,.75):cov*.7)); } }
    x.putImageData(id,0,0);
  },
  render(slot,anim){
    const v=this.cur, s=this.src(v), V=HEAD_VIEWS[s];
    slot.innerHTML=`<div class="hm-stage${v==="right"?" flip":""}${anim?" anim":""}" style="aspect-ratio:${V.w}/${V.h}"><img class="hm-img" src="${V.img}" alt="" draggable="false"><canvas class="hm-ov"></canvas></div>`;
    const stage=slot.firstChild; this.drawOverlay(stage);
    const wrap=slot.closest(".head-wrap"); if(wrap){ wrap.querySelectorAll("[data-hview]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.hview===v)); const dots=wrap.querySelector(".head-dots"); if(dots) dots.innerHTML=HEAD_ORDER.map(k=>`<button type="button" data-hview="${k}" aria-label="${({front:"Спереди",left:"Слева",back:"Сзади",right:"Справа"})[k]}" aria-current="${k===v}"></button>`).join(""); }
    let down=null;
    stage.addEventListener("pointerdown",ev=>{ down={x:ev.clientX,y:ev.clientY,m:0}; });
    stage.addEventListener("pointermove",ev=>{ if(down) down.m=Math.max(down.m,Math.abs(ev.clientX-down.x)); });
    stage.addEventListener("pointercancel",()=>{ down=null; });
    stage.addEventListener("pointerup",ev=>{ if(!down) return; const dx=ev.clientX-down.x, dy=ev.clientY-down.y; const m=down.m; down=null;
      if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)){ const i=HEAD_ORDER.indexOf(this.cur); this.cur=HEAD_ORDER[(i+(dx<0?1:3))%4]; this.render(slot,true); return; }
      if(m>10) return;
      const rc=stage.getBoundingClientRect(); let px=(ev.clientX-rc.left)/rc.width*V.w; const py=(ev.clientY-rc.top)/rc.height*V.h; if(v==="right") px=V.w-1-px;
      const z=this.zoneAt(v,px,py); if(!z) return;
      const sr=slot.getBoundingClientRect(); this.pop={name:z,x:ev.clientX-sr.left,y:ev.clientY-sr.top,t:performance.now()};
      if(this.onToggle) this.onToggle(z); });
  },
  view(v){ if(!HEAD_ORDER.includes(v)) return; this.cur=v; const slot=document.getElementById("head3d-slot"); if(slot) this.render(slot,true); },
  setSel(zones){ this.zones=zones.slice(); },
  mount(slot,zones,onToggle){
    if(!slot) return false;
    this.onToggle=onToggle; this.setSel(zones); this.load(); this.render(slot);
    if(this.pop&&performance.now()-this.pop.t<600){ const on=zones.includes(this.pop.name); const d=document.createElement("div"); d.className="zone-pop"+(on?" on":""); d.textContent=(on?"✓ ":"✕ ")+this.pop.name; slot.appendChild(d); setTimeout(()=>d.classList.add("out"),1100); setTimeout(()=>d.remove(),1500); this.pop=null; }
    return true;
  }
};

/* ---------- storage ---------- */
function saveLocal(){ try{ localStorage.setItem(LS,JSON.stringify(attacks)); if(pills) localStorage.setItem(LSP,JSON.stringify(pills)); }catch(e){} }
function loadLocal(){ try{ const v=JSON.parse(localStorage.getItem(LS)||"[]"); if(Array.isArray(v)) attacks=v; const p=JSON.parse(localStorage.getItem(LSP)||"null"); if(Array.isArray(p)) pills=p; }catch(e){} }
async function initStore(){
  if(!window.claude?.use){ render(); return; }
  try{
    const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
    const id=user?await user.id():null;
    if(!db||!id){ render(); return; }
    const col=db.collection("data/users/"+id);
    store=col; mode="cloud";
    let first=true;
    col.onSnapshot(snap=>{
      const docs=snap.docs.map(d=>d.data()).filter(Boolean);
      const cloud=docs.filter(x=>x.kind==="attack");
      const set=docs.find(x=>x.kind==="settings");
      if(first){ first=false;
        const ids=new Set(cloud.map(a=>a.id)); const pending=attacks.filter(a=>!ids.has(a.id));
        pending.forEach(a=>col.doc(a.id).set({...a,kind:"attack"}).catch(()=>{})); attacks=cloud.concat(pending);
        if(set&&Array.isArray(set.pills)) pills=set.pills; else if(pills) col.doc("settings").set({kind:"settings",pills}).catch(()=>{});
      } else { attacks=cloud; if(set&&Array.isArray(set.pills)) pills=set.pills; }
      saveLocal(); if(!sheetKind) render();
    },()=>{ mode="local"; store=null; render(); });
  }catch(e){ render(); }
}
async function persist(a,quiet){
  const i=attacks.findIndex(x=>x.id===a.id); if(i>=0) attacks[i]=a; else attacks.push(a);
  saveLocal(); if(!sheetKind||quiet) render();
  if(store){ try{ await store.doc(a.id).set({...a,kind:"attack"}); }catch(e){ if(e&&e.code==="quota_exceeded") toast("Хранилище заполнено. Удалите старые записи."); else toast("Нет связи с облаком, запись сохранена на устройстве"); } }
}
async function savePills(list){
  pills=list; saveLocal();
  if(store){ try{ await store.doc("settings").set({kind:"settings",pills}); }catch(e){ toast("Нет связи с облаком, список сохранён на устройстве"); } }
}
async function remove(id){
  attacks=attacks.filter(a=>a.id!==id); saveLocal(); render();
  if(store){ try{ await store.doc(id).delete(); }catch(e){} }
}

/* ---------- stats ---------- */
function windowOf(days,offset=0){ const to=new Date(); to.setHours(23,59,59,999); to.setDate(to.getDate()-offset); const from=new Date(to); from.setHours(0,0,0,0); from.setDate(from.getDate()-days+1); return {from,to}; }
function summary(days,offset=0){
  const {from,to}=windowOf(days,offset);
  const list=attacks.filter(a=>new Date(a.end||Date.now())>=from && new Date(a.start)<=to);
  const hd=new Set(), md=new Set(); const dayMax={};
  const inW=k=>{ const d=new Date(k+"T12:00"); return d>=from&&d<=to; };
  list.forEach(a=>{ daysOf(a).forEach(k=>{ if(inW(k)){ hd.add(k); dayMax[k]=Math.max(dayMax[k]||0,a.intensity||0);} }); (a.meds||[]).forEach(m=>{ const k=dayKey(m.time?new Date(m.time):new Date(a.start)); if(inW(k)) md.add(k); }); });
  const done=list.filter(a=>a.end); const withI=list.filter(a=>hasI(a.intensity));
  const avgI=withI.length?withI.reduce((s,a)=>s+a.intensity,0)/withI.length:0;
  const avgD=done.length?done.reduce((s,a)=>s+dur(a),0)/done.length:null;
  const trig={}, meds={}, zc={};
  list.forEach(a=>{ zonesOf(a).forEach(z=>zc[z]=(zc[z]||0)+1); (a.triggers||[]).forEach(t=>trig[t]=(trig[t]||0)+1); (a.meds||[]).forEach(m=>{ const n=medLabel(m).trim(); if(!n) return; meds[n]=meds[n]||{n:0,ok:0,part:0,no:0}; meds[n].n++; if(m.effect==="Помогло") meds[n].ok++; else if(m.effect==="Частично") meds[n].part++; else if(m.effect==="Не помогло") meds[n].no++; }); });
  return {list,headDays:hd.size,medDays:md.size,avgI,avgD,trig,meds,dayMax,zc};
}
function monthStats(y,m){
  const pref=`${y}-${pad(m+1)}`; const dayMax={}; const medCount={};
  attacks.forEach(a=>{ daysOf(a).filter(k=>k.startsWith(pref)).forEach(k=>dayMax[k]=Math.max(dayMax[k]||0,a.intensity||0)); (a.meds||[]).forEach(md=>{ const k=dayKey(md.time?new Date(md.time):new Date(a.start)); if(k.startsWith(pref)) medCount[k]=(medCount[k]||0)+1; }); });
  return {dayMax,medCount};
}

/* ---------- widgets ---------- */
function ticks(days=16){
  const s=summary(days); let bars="", refl="";
  for(let i=days-1;i>=0;i--){ const d=new Date(); d.setDate(d.getDate()-i); const k=dayKey(d); const had=k in s.dayMax; const v=s.dayMax[k]||0; const today=i===0;
    bars+=had?`<i class="${today?"today":""}" style="height:${18+(v||3)*5.6}px;${today?"":"background:"+(v?lvlColor(v):"var(--ink-2)")}" title="${fmtDate(d)}: ${v?v+"/10":"сила не указана"}"></i>`:`<i class="zero ${today?"today":""}" title="${fmtDate(d)}: без боли"></i>`;
    refl+=`<i style="height:${had?Math.max(5,(v||3)*1.3):4}px"></i>`; }
  return `<div class="ticks">${bars}</div><div class="ticks-refl">${refl}</div>`;
}
function dotGauge(val,max,total=30){
  const n=total, start=135, sweep=270, R=62, cx=80, cy=80; let dots="";
  const color=val>=10?"var(--bad)":val>=7?"var(--warn)":"var(--ok)";
  for(let i=0;i<n;i++){ const ang=(start+sweep*i/(n-1))*Math.PI/180; const x=cx+R*Math.cos(ang), y=cy+R*Math.sin(ang); const on=i<val;
    dots+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${on?3.6:2.4}" fill="${on?color:"var(--ink-3)"}" ${i===9&&!on?'stroke="var(--ink-2)" stroke-width="1"':""}/>`; }
  return `<div class="gauge"><svg viewBox="0 0 160 160" aria-hidden="true">${dots}</svg><div class="c"><b class="num">${val}</b><span>из ${max} дней</span></div></div>`;
}

function reportText(days=90){
  const s=summary(days); const list=[...s.list].sort((a,b)=>a.start.localeCompare(b.start));
  let t=`ДНЕВНИК ГОЛОВНОЙ БОЛИ — последние ${days} дней\nСоставлен: ${fmtDate(new Date())} ${new Date().getFullYear()}\n\n`;
  t+=`Приступов: ${list.length}\nДней с головной болью: ${s.headDays}\nДней с приёмом обезболивающих: ${s.medDays}\nСредняя интенсивность: ${s.avgI?s.avgI.toFixed(1):"—"}/10\nСредняя длительность: ${s.avgD!=null?fmtDur(s.avgD):"—"}\n`;
  const tr=Object.entries(s.trig).sort((a,b)=>b[1]-a[1]); if(tr.length) t+=`Частые триггеры: ${tr.map(([k,v])=>k+" ("+v+")").join(", ")}\n`;
  const md=Object.entries(s.meds); if(md.length) t+=`Лекарства: ${md.map(([k,v])=>`${k} ×${v.n} (помогло ${v.ok}, частично ${v.part}, нет ${v.no})`).join("; ")}\n`;
  t+=`\nЗАПИСИ\n`;
  list.forEach(a=>{ const d=new Date(a.start); t+=`• ${fmtDate(d)} ${fmtTime(d)} — ${hasI(a.intensity)?a.intensity+"/10":"сила не указана"}, ${a.end?fmtDur(dur(a)):"идёт"}${zonesText(a)?", "+zonesText(a):""}${a.aura?", аура":""}`;
    if(a.symptoms?.length) t+=`; симптомы: ${a.symptoms.join(", ")}`; if(a.triggers?.length) t+=`; триггеры: ${a.triggers.join(", ")}`;
    if(a.meds?.length) t+=`; лекарства: ${a.meds.map(m=>`${medLabel(m)} в ${fmtTime(new Date(m.time||a.start))}${m.effect?" ("+m.effect.toLowerCase()+")":""}`).join(", ")}`;
    if(a.note) t+=`; ${a.note}`; t+="\n"; });
  return t;
}
function csv(){
  const q=v=>`"${String(v??"").replace(/"/g,'""')}"`;
  const rows=[["Начало","Окончание","Длительность, мин","Сила","Локализация","Аура","Симптомы","Триггеры","Лекарства","Заметка"]];
  sorted().reverse().forEach(a=>rows.push([toLocalInput(new Date(a.start)).replace("T"," "),a.end?toLocalInput(new Date(a.end)).replace("T"," "):"",a.end?Math.round(dur(a)/60000):"",hasI(a.intensity)?a.intensity:"",zonesText(a),a.aura?"да":"нет",(a.symptoms||[]).join("; "),(a.triggers||[]).join("; "),(a.meds||[]).map(m=>`${medLabel(m)} ${fmtTime(new Date(m.time||a.start))} ${m.effect||""}`.trim()).join("; "),a.note]));
  return "﻿"+rows.map((r,ri)=>r.map((c,i)=>q(ri>0&&i===r.length-1?c:tr(String(c??"")))).join(";")).join("\r\n");
}

   <div class="spread"><h2>Для врача</h2>${closeBtn}</div>
   <div class="chips">${[30,90,180].map(d=>`<button class="chip" aria-pressed="${d===reportDays}" data-rdays="${d}">${d} дней</button>`).join("")}</div>
   <pre class="report" id="report-text">${esc(reportText(reportDays))}</pre>
   <div class="row"><button class="btn dark" data-act="copy">Скопировать текст</button><button class="btn" data-act="csv">Скачать таблицу</button></div>
   <div class="card" style="gap:10px"><span class="lab">Резервная копия</span><div class="muted" style="font-size:13px">Записи хранятся только на этом телефоне. Время от времени сохраняйте копию в «Файлы» или iCloud, чтобы ничего не потерять. ${backupAgo()}</div>
   <div class="row"><button class="btn" data-act="backup">Сохранить копию</button><button class="btn" data-act="restore">Восстановить из файла</button></div><input type="file" id="restore-file" accept=".json,application/json" hidden></div></div>`);
}


async function saveFile(name,text,type){
  const blob=new Blob([text],{type});
  try{ const f=new File([blob],name,{type}); if(navigator.canShare&&navigator.canShare({files:[f]})){ await navigator.share({files:[f],title:name}); return true; } }catch(e){ if(e&&e.name==="AbortError") return false; }
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1500); return true;
}
const BK_LAST="migraine-last-backup", BK_SNOOZE="migraine-backup-snooze", BK_FIRST="migraine-first-use", BK_DAYS=14;
const lsGet=k=>{ try{ return localStorage.getItem(k); }catch(e){ return null; } }, lsSet=(k,v)=>{ try{ localStorage.setItem(k,v); }catch(e){} };
async function doBackup(){ const ok=await saveFile(`migraine-backup-${dayKey(new Date())}.json`,backupJSON(),"application/json"); if(ok){ lsSet(BK_LAST,String(Date.now())); lsSet(BK_SNOOZE,""); toast("Копия сохранена"); } return ok; }
function backupDue(){
  if(!attacks.length) return false;
  if(!lsGet(BK_FIRST)) lsSet(BK_FIRST,String(Date.now()));
  const now=Date.now(), last=+(lsGet(BK_LAST)||lsGet(BK_FIRST)), snooze=+(lsGet(BK_SNOOZE)||0);
  return now-last>=BK_DAYS*864e5 && now>=snooze;
}
function backupAgo(){ const l=+(lsGet(BK_LAST)||0); if(!l) return "Копию ещё ни разу не сохраняли."; const d=Math.floor((Date.now()-l)/864e5); return `Последняя копия — ${d} ${plural(d,"день","дня","дней")} назад.`; }
function openBackupReminder(){
  openSheet("bkrem",`<div class="sheet" role="dialog" aria-label="Напоминание о копии"><div class="grab"></div>
   <div class="spread"><h2>Сохраните копию</h2>${closeBtn}</div>
   <div class="card" style="gap:8px"><div style="font-size:15px">Записи хранятся только на этом телефоне. Раз в две недели стоит сохранять копию в «Файлы» или iCloud Drive, чтобы ничего не потерять.</div><div class="muted" style="font-size:13px">${backupAgo()} Записей в дневнике: ${attacks.length}.</div></div>
   <button type="button" class="save-btn" data-act="bk-now"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2"><path d="m4 10 4 4 8-8"/></svg>Сохранить копию</button>
   <button type="button" class="btn" data-act="bk-later" style="align-self:center">Напомнить через 3 дня</button></div>`);
}
function backupJSON(){ return JSON.stringify({app:"migraine-diary",version:1,saved:new Date().toISOString(),attacks,pills:getPills()},null,1); }
/* ---------- actions ---------- */
async function quickStart(){
  if(ongoing()) return;
  const a=blank(new Date(),null,null); await persist(a,true);
  toast("Мигрень началась в "+fmtTime(new Date()),"Изменить время",()=>openTime(a));
}
async function quickEnd(id){
  const a=attacks.find(x=>x.id===id); if(!a) return;
  const done={...a,end:new Date().toISOString()}; await persist(done,true);
  toast("Закончилась. Длилась "+fmtDur(dur(done)),"Изменить время",()=>openTime(done));
}
async function quickPill(id,pid){
  const a=attacks.find(x=>x.id===id); const p=getPills().find(x=>x.id===pid); if(!a||!p) return;
  const meds=[...(a.meds||[])];
  let last=-1; meds.forEach((m,i)=>{ if(isPill(m,p)) last=i; });
  if(last>=0){ await untake(id,last); return; }
  await addDose(id,{pillId:p.id,name:p.name,dose:p.dose});
}
async function addDose(id,m){
  const a=attacks.find(x=>x.id===id); if(!a) return;
  const entry={pillId:m.pillId,name:m.name,dose:m.dose,time:new Date().toISOString(),effect:""};
  await persist({...a,meds:[...(a.meds||[]),entry]},true);
  toast(medLabel(entry)+" в "+fmtTime(new Date()),"Отменить",async()=>{ const cur=attacks.find(x=>x.id===id); if(cur){ const ms=[...cur.meds]; const k=ms.map(x=>x.time+x.name).lastIndexOf(entry.time+entry.name); if(k>=0) ms.splice(k,1); await persist({...cur,meds:ms},true); } });
}
async function untake(id,i){
  const a=attacks.find(x=>x.id===id); if(!a||!a.meds[i]) return;
  const ms=[...a.meds]; const [gone]=ms.splice(i,1); await persist({...a,meds:ms},true);
  toast(medLabel(gone)+" убран","Вернуть",async()=>{ const cur=attacks.find(x=>x.id===id); if(cur){ const r=[...cur.meds]; r.splice(Math.min(i,r.length),0,gone); await persist({...cur,meds:r},true); } });
}


document.addEventListener("click",async ev=>{
  if(ev.target.id==="toast-act"){ $("#toast").hidden=true; const f=toastAct; toastAct=null; if(f) f(); return; }
  const t=ev.target.closest("button,[data-act],[data-day]"); if(!t) return;
  if(t.dataset.act==="close-bg" && ev.target!==t) return;
  const act=t.dataset.act, id=t.dataset.id;
  if(t.dataset.tab && t.classList.contains("tab")){ tab=t.dataset.tab; render(); window.scrollTo(0,0); return; }
  if(act==="tab"){ tab=t.dataset.tab; render(); window.scrollTo(0,0); return; }
  if(act==="lang"){ setLang(LANG==="ru"?"en":"ru"); return; }
  if(act==="start"){ await quickStart(); return; }
  if(act==="end"){ await quickEnd(id); return; }
  if(t.dataset.qint){ const a=attacks.find(x=>x.id===id); if(a) await persist({...a,intensity:+t.dataset.qint},true); return; }
  if(t.dataset.quickpill){ await quickPill(id,t.dataset.quickpill); return; }
  if(t.dataset.untake){ await untake(id,+t.dataset.untake); return; }
  if(t.dataset.qplus!==undefined){ const a=attacks.find(x=>x.id===id); const m=a&&a.meds.find(x=>medKey(x)===t.dataset.qplus); if(m) await addDose(id,m); return; }
  if(t.dataset.qminus!==undefined){ const a=attacks.find(x=>x.id===id); if(a){ let last=-1; a.meds.forEach((x,i)=>{ if(medKey(x)===t.dataset.qminus) last=i; }); if(last>=0) await untake(id,last); } return; }
  if(act==="time"){ const a=attacks.find(x=>x.id===id); if(a) openTime(a); return; }
  if(act==="past"){ const d=new Date(); d.setHours(d.getHours()-3,0,0,0); const e=new Date(d); e.setHours(e.getHours()+2); openForm(blank(d,e,null),true); return; }
  if(act==="new"){ const on=ongoing(); if(on){ openForm(on); return; } const d=new Date(); d.setHours(d.getHours()-3,0,0,0); const e=new Date(d); e.setHours(e.getHours()+2); openForm(blank(d,e,null),true); return; }
  if(act==="edit"){ const a=attacks.find(x=>x.id===id); if(a) openForm(a); return; }
  if(act==="pills"){ openPills(false); return; }
  if(act==="close"||act==="close-bg"){ if(sheetKind==="form"||sheetKind==="pills"&&backToForm) readForm(); closeSheet(); return; }
  if(t.dataset.day){ const k=t.dataset.day; const list=sorted().filter(a=>daysOf(a).includes(k)||(a.meds||[]).some(m=>dayKey(new Date(m.time||a.start))===k));
    if(list.length===1){ openForm(list[0]); return; }
    if(list.length>1){ const d=new Date(k+"T12:00"); openSheet("day",`<div class="sheet" role="dialog" aria-label="Записи за день"><div class="grab"></div><div class="spread"><h2>${fmtDate(d)}</h2>${closeBtn}</div><div class="muted" style="font-size:14px">${list.length} ${plural(list.length,"запись","записи","записей")} в этот день</div><div class="list">${list.map(itemHtml).join("")}</div></div>`); }
    return; }
  if(act==="cal"){ calMonth.setMonth(calMonth.getMonth()+ +t.dataset.d); render(); return; }
  if(act==="report"){ openReport(); return; }
  if(t.dataset.rdays){ reportDays=+t.dataset.rdays; openReport(); return; }
  if(act==="copy"){ const txt=tr(reportText(reportDays)); try{ await navigator.clipboard.writeText(txt); toast("Скопировано"); }catch(e){ const r=document.createRange(); r.selectNodeContents($("#report-text")); const s=getSelection(); s.removeAllRanges(); s.addRange(r); toast("Текст выделен, скопируйте его вручную"); } return; }
  if(act==="csv"){ await saveFile(`migraine-${dayKey(new Date())}.csv`,csv(),"text/csv;charset=utf-8"); return; }
  if(act==="backup"){ await doBackup(); return; }
  if(act==="bk-now"){ if(await doBackup()) closeSheet(); return; }
  if(act==="bk-later"){ lsSet(BK_SNOOZE,String(Date.now()+3*864e5)); closeSheet(); return; }
  if(act==="restore"){ document.getElementById("restore-file").click(); return; }
  /* time sheet */
  if(sheetKind==="time"){
    if(t.dataset.shift){ readTime(); const k=t.dataset.shift; const d=new Date(timeEdit[k]); d.setMinutes(d.getMinutes()+ +t.dataset.m); if(k==="end"&&d>new Date()){ toast("Нельзя позже текущего времени"); return; } timeEdit[k]=d.toISOString(); renderTime(); return; }
    if(act==="t-endnow"){ readTime(); timeEdit.end=new Date().toISOString(); renderTime(); return; }
    if(act==="t-reopen"){ readTime(); timeEdit.end=null; renderTime(); return; }
    if(act==="t-save"){ readTime(); if(timeEdit.end&&new Date(timeEdit.end)<new Date(timeEdit.start)){ toast("Конец раньше начала. Проверьте время."); return; } if(!timeEdit.end&&ongoing()&&ongoing().id!==timeEdit.id){ toast("Уже есть идущая мигрень"); return; } const a=attacks.find(x=>x.id===timeEdit.id); const upd={...a,start:timeEdit.start,end:timeEdit.end}; $("#sheet").innerHTML=""; sheetKind=null; timeEdit=null; await persist(upd); toast("Время сохранено"); return; }
    return;
  }
  /* pills sheet */
  if(sheetKind==="pills"){
    if(t.dataset.delpill){ readPills(); pillsDraft.splice(+t.dataset.delpill,1); renderPills(); return; }
    if(act==="addpill"){ readPills(); const n=$("#np-name").value.trim(), d=$("#np-dose").value.trim(); if(!n){ toast("Впишите название таблетки"); $("#np-name").focus(); return; } pillsDraft.push({id:"p"+uid(),name:n,dose:d}); renderPills(); $("#np-name")?.focus(); return; }
    if(act==="savepills"){ readPills(); const n=$("#np-name").value.trim(); if(n) pillsDraft.push({id:"p"+uid(),name:n,dose:$("#np-dose").value.trim()}); await savePills(pillsDraft.filter(p=>p.name.trim()).map(p=>({...p,name:p.name.trim(),dose:(p.dose||"").trim()}))); toast("Список сохранён"); closeSheet(); return; }
    return;
  }
  /* details form */
  if(!editing) return;
  if(act==="showtimes"){ readForm(); showTimes=true; renderForm(); return; }
  if(act==="pills-from-form"){ readForm(); openPills(true); return; }
  if(act==="del"){ readForm(); confirmDel=true; renderForm(); return; }
  if(act==="del-no"){ readForm(); confirmDel=false; renderForm(); return; }
  if(act==="del-yes"){ const i=editing.id; $("#sheet").innerHTML=""; sheetKind=null; editing=null; await remove(i); toast("Запись удалена"); return; }
  if(t.dataset.int){ readForm(); editing.intensity=+t.dataset.int; renderForm(); return; }
  if(t.dataset.chip){ readForm(); const k=t.dataset.chip, v=t.dataset.v; if(t.dataset.multi==="true"){ const arr=editing[k]; const i=arr.indexOf(v); i>=0?arr.splice(i,1):arr.push(v); } else editing[k]=editing[k]===v?"":v; renderForm(); return; }
  if(t.dataset.aura){ readForm(); editing.aura=!editing.aura; renderForm(); return; }
  if(t.dataset.zone){ toggleZone(t.dataset.zone); return; }
  if(t.dataset.hview){ Head3D.view(t.dataset.hview); return; }
  if(t.dataset.addpill){ readForm(); const p=getPills().find(x=>x.id===t.dataset.addpill); if(p){ let last=-1; editing.meds.forEach((m,i)=>{ if(isPill(m,p)) last=i; }); if(last>=0){ const [gone]=editing.meds.splice(last,1); toast(medLabel(gone)+" убран"); } else { const time=editing.end?editing.start:new Date().toISOString(); editing.meds.push({pillId:p.id,name:p.name,dose:p.dose,time,effect:""}); } } renderForm(); return; }
  if(t.dataset.fplus!==undefined){ readForm(); const idx=editing.meds.map((m,i)=>medKey(m)===t.dataset.fplus?i:-1).filter(i=>i>=0); const m=editing.meds[idx[idx.length-1]]; if(m){ const nt=editing.end?new Date(+new Date(m.time||editing.start)+2*36e5):new Date(); editing.meds.push({pillId:m.pillId,name:m.name,dose:m.dose,time:nt.toISOString(),effect:m.effect||""}); } renderForm(); return; }
  if(t.dataset.fminus!==undefined){ readForm(); let last=-1; editing.meds.forEach((m,i)=>{ if(medKey(m)===t.dataset.fminus) last=i; }); if(last>=0) editing.meds.splice(last,1); renderForm(); return; }
  if(t.dataset.effg!==undefined){ readForm(); const cur=editing.meds.find(m=>medKey(m)===t.dataset.effg); const v=cur&&cur.effect===t.dataset.v?"":t.dataset.v; editing.meds.forEach(m=>{ if(medKey(m)===t.dataset.effg) m.effect=v; }); renderForm(); return; }
  if(t.dataset.eff){ readForm(); const m=editing.meds[+t.dataset.eff]; m.effect=m.effect===t.dataset.v?"":t.dataset.v; renderForm(); return; }
  if(t.dataset.delmed){ readForm(); editing.meds.splice(+t.dataset.delmed,1); renderForm(); return; }
});
document.addEventListener("submit",async ev=>{
  if(ev.target.id!=="form") return; ev.preventDefault(); readForm();
  const a=editing; a.side="";
  if(a.end && new Date(a.end)<new Date(a.start)){ toast("Конец раньше начала. Проверьте время."); return; }
  if(!a.end && ongoing() && ongoing().id!==a.id){ toast("Уже есть идущая мигрень. Укажите, когда закончилась эта."); return; }
  $("#sheet").innerHTML=""; sheetKind=null; editing=null; await persist(a); toast("Сохранено");
});
document.addEventListener("change",async ev=>{
  if(ev.target.id!=="restore-file"||!ev.target.files[0]) return;
  try{ const d=JSON.parse(await ev.target.files[0].text()); if(!Array.isArray(d.attacks)) throw 0;
    const ids=new Set(attacks.map(a=>a.id)); let n=0; d.attacks.forEach(a=>{ if(a&&a.id&&a.start&&!ids.has(a.id)){ attacks.push(a); n++; } });
    if(Array.isArray(d.pills)&&d.pills.length) pills=d.pills;
    saveLocal(); closeSheet(); toast(n?`Восстановлено записей: ${n}`:"Новых записей в файле нет");
  }catch(e){ toast("Не удалось прочитать файл. Нужен файл копии из этого приложения."); }
  ev.target.value="";
});
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&sheetKind){ if(sheetKind==="form") readForm(); closeSheet(); } });
setInterval(()=>{ if(ongoing() && !sheetKind && !drag && tab==="home") render(); },60000);


/* ---------- swipe sliders ---------- */
let drag=null;
function swipeDone(el){ const kind=el.dataset.swipe, id=el.dataset.id; try{ navigator.vibrate&&navigator.vibrate(20); }catch(e){} if(kind==="start") quickStart(); else quickEnd(id); }
document.addEventListener("pointerdown",ev=>{
  const el=ev.target.closest(".swipe"); if(!el) return;
  const knob=el.querySelector(".knob"); const onKnob=ev.target.closest(".knob");
  const max=el.clientWidth-62; if(max<=0) return;
  drag={el,knob,fill:el.querySelector(".swipe-fill"),text:el.querySelector(".swipe-text"),chev:el.querySelector(".chev"),x0:ev.clientX,dx:0,max,id:ev.pointerId,onKnob:!!onKnob};
  el.classList.remove("anim"); try{ el.setPointerCapture(ev.pointerId); }catch(e){}
});
document.addEventListener("pointermove",ev=>{
  if(!drag||ev.pointerId!==drag.id) return;
  const dx=Math.max(0,Math.min(drag.max,ev.clientX-drag.x0)); drag.dx=dx;
  drag.knob.style.transform=`translateX(${dx}px)`; drag.fill.style.width=(62+dx)+"px";
  const k=dx/drag.max; drag.text.style.opacity=String(1-k*0.9); drag.chev.style.opacity=String(1-k);
});
function endDrag(ev){
  if(!drag||ev.pointerId!==drag.id) return; const d=drag; drag=null; d.el.classList.add("anim");
  if(d.dx>=d.max/3){ d.knob.style.transform=`translateX(${d.max}px)`; d.fill.style.width="100%"; setTimeout(()=>swipeDone(d.el),220); }
  else { d.knob.style.transform=""; d.fill.style.width=""; d.text.style.opacity=""; d.chev.style.opacity="";
    if(d.dx<6){ /* tap: nudge hint */ d.knob.style.transform="translateX(26px)"; setTimeout(()=>{ d.knob.style.transform=""; },260); toast("Сдвиньте кружок вправо до конца"); } }
}
document.addEventListener("pointerup",endDrag); document.addEventListener("pointercancel",endDrag);
document.addEventListener("keydown",ev=>{ const el=ev.target.closest&&ev.target.closest(".swipe"); if(el&&(ev.key==="Enter"||ev.key===" ")){ ev.preventDefault(); swipeDone(el); } });

loadLocal(); render(); initStore();
try{ navigator.storage&&navigator.storage.persist&&navigator.storage.persist(); }catch(e){}
function checkBackup(){ if(!sheetKind&&backupDue()) openBackupReminder(); }
setTimeout(checkBackup,900);
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") setTimeout(checkBackup,600); });
if("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
